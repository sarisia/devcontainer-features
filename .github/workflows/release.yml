name: release

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: devcontainers/action@v1
        with:
          publish-features: true
          base-path-to-features: ".devcontainer/features"
